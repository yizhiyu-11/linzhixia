name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 语法检查（src / server）
        run: |
          set -e
          for f in src/*.mjs server/*.mjs; do
            node --check "$f"
          done
          echo "语法检查通过"

      - name: 人设 JSON 校验
        run: |
          set -e
          for f in personas/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log('ok', process.argv[1])" "$f"
          done

      - name: 场景配置校验
        run: node scripts/scene2-preview.mjs

      - name: 冒烟测试
        run: node scripts/smoke.mjs

      - name: 场景层单测
        run: node scripts/test-scene-v2.mjs

      - name: 用户情绪模型单测（失败时把 ✗ 行标成注解，方便查）
        run: |
          set -o pipefail
          node scripts/test-uaffect.mjs 2>&1 | tee uaffect.log
      - name: 打印失败断言
        if: failure()
        run: |
          echo "## 失败的断言" >> \
          grep '✗' uaffect.log >> \ || echo "（没抓到 ✗ 行）" >> \
          grep '✗' uaffect.log | while read -r l; do echo "::error::\"; done || true
